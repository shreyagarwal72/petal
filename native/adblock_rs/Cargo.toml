[package]
name = "adblock_petal_wasm"
version = "0.13.5"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "0.13.5", default-features = true, features = ["css-validation"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
