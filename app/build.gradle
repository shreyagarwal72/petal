apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'dagger.hilt.android.plugin'

def releaseStoreFile = providers.gradleProperty("RELEASE_STORE_FILE").orNull
def releaseStorePassword = providers.gradleProperty("RELEASE_STORE_PASSWORD").orNull
def releaseKeyAlias = providers.gradleProperty("RELEASE_KEY_ALIAS").orNull
def releaseKeyPassword = providers.gradleProperty("RELEASE_KEY_PASSWORD").orNull

android {

    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.petal.browser"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 462
        versionName "4.7"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        resConfigs "ar", "b+hi+Latn", "b+sr+Latn", "cs", "de", "el", "es", "et", "fa", "fr", "he", "hi", "hu", "id", "it", "ja", "nl", "pl", "pt", "ro", "ru", "sr", "sv", "tr", "uk", "vi", "zh", "zh-rTW"
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        github {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_STORE_BUILD", "false"
            buildConfigField "boolean", "IS_FDROID_BUILD", "false"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", "\"github\""
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_STORE_BUILD", "true"
            buildConfigField "boolean", "IS_FDROID_BUILD", "false"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", "\"play\""
        }
        fdroid {
            dimension "distribution"
            buildConfigField "boolean", "IS_PLAY_STORE_BUILD", "false"
            buildConfigField "boolean", "IS_FDROID_BUILD", "true"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", "\"fdroid\""
        }
    }

    sourceSets {
        github {
            java.srcDirs += ['src/ads/java', 'src/noPlay/java']
            kotlin.srcDirs += ['src/ads/java', 'src/noPlay/java']
        }
        play {
            java.srcDirs += ['src/ads/java', 'src/play/java']
            kotlin.srcDirs += ['src/ads/java', 'src/play/java']
        }
        fdroid {
            java.srcDirs += ['src/noAds/java', 'src/noPlay/java']
            kotlin.srcDirs += ['src/noAds/java', 'src/noPlay/java']
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            // Keep the universal APK so all supported ABIs are available in one package.
            universalApk true
        }
    }

    // Keep ABI splits available for variant generation while retaining the universal APK.
    // Google Play / bundletool will deliver only the native ABI required by the
    // target device instead of downloading GeckoView and other native libraries
    // for unrelated architectures.
    bundle {
        abi {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile &&
                releaseStorePassword &&
                releaseKeyAlias &&
                releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
            enableV4Signing = false
        }
    }

    buildTypes {
        release {
            // R8: shrink, optimise and obfuscate. Keep rules live in proguard-rules.pro;
            // the mapping for de-obfuscating crash traces is in build/outputs/mapping/release.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            // Native Crash Support
            // 'SYMBOL_TABLE' generates symbol tables rapidly without massive DWARF dumps.
            // Full DWARF extraction ('FULL') is only needed if explicitly requested via -PFULL_NDK_SYMBOLS=true.
            ndk {
                debugSymbolLevel(project.findProperty('FULL_NDK_SYMBOLS') == 'true' ? 'FULL' : 'SYMBOL_TABLE')
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
    namespace 'com.petal.browser'

    // youtubedl-android (Chaquopy/Python) unzips libpython.zip.so from disk at runtime via
    // ZipFile/RandomAccessFile. When AGP packages native libs compressed and uncompressed for
    // mmap loading (the default since AGP 4.2 targeting API 23+), .so files are stored
    // compressed inside the APK and never extracted to the app's native lib directory, so
    // YoutubeDL.init() throws FileNotFoundException on libpython.zip.so. Force legacy
    // (uncompressed, extracted-to-disk) packaging so youtubedl-android can open it as a file.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libxul.so', '**/libc++_shared.so', '**/libmozglue.so']
            // These are ZIP archives (Python interpreter, ffmpeg, aria2c binaries bundled by
            // youtubedl-android), not ELF shared objects — named .so only so useLegacyPackaging
            // extracts them to disk for the library's own ZipFile/RandomAccessFile access.
            // Excluding them from stripping prevents llvm-strip from failing on non-ELF input.
            keepDebugSymbols += ['**/libaria2c.zip.so', '**/libffmpeg.zip.so', '**/libpython.zip.so']
        }
        resources {
            pickFirsts += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    return void
}

// Kotlin 2.4 removed the legacy android { kotlinOptions {} } DSL (hard compile error).
// Use the compilerOptions DSL instead.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.addAll(
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi"
        )
    }
}

tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask).configureEach {
    enabled = false
}

configurations.all {
    exclude group: 'org.mozilla.geckoview', module: 'geckoview-omni'
    resolutionStrategy {
        force 'org.mozilla.geckoview:geckoview:159.0.20261102144711'
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-reflect:2.4.0'
        // Dagger/Hilt (>= 2.57) no longer shades kotlin-metadata-jvm. Its bundled reader tops out at
        // Kotlin metadata 2.3.0. This was forced to 2.4.0 to match Mozilla Components 155's metadata
        // version. UNVERIFIED for Components 156 — if 156 ships newer Kotlin metadata than 2.4.0,
        // this force may need bumping too, or this whole block may become unnecessary if Hilt's
        // bundled reader has since been updated. Check the build error here first if compilation fails.
        force 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    githubImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    implementation 'com.airbnb.android:lottie-compose:6.7.1'

    // PDFBox-Android — used only for the "Edit PDF text" feature (real embedded
    // text extraction + content-stream rewrite). PdfRenderer above stays as the
    // fast rasterizer for normal viewing; PDFBox only loads when edit mode opens.
    // NOTE: unverified in a real build — no Android SDK available to compile-check.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Jetpack Glance — used for the home screen widget so it can be built with real
    // Material 3 (Expressive) components/color roles instead of hand-rolled RemoteViews.
    implementation 'androidx.glance:glance:1.2.0'
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'androidx.glance:glance-material3:1.2.0'

    // AndroidX Activity, Lifecycle, and SavedState Explicit KTX Dependencies
    implementation 'androidx.core:core-splashscreen:1.2.0'
    // Installs the baseline profile (src/main/baseline-prof.txt) at first run so hot UI paths
    // are AOT-compiled instead of interpreted/JIT'd. Cuts cold-start and first-scroll jank.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.savedstate:savedstate-ktx:1.5.0'

    // Compose Dependencies
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // Pinned alpha for Material 3 Expressive APIs. It MUST stay in step with the BOM's
    // foundation/ui versions, otherwise text fields crash with AbstractMethodError
    // (CustomStyle.applyStyle). Bump this and the BOM together.
    implementation 'androidx.compose.material3:material3:1.5.0-alpha22'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-gif:2.7.0'
    // Real liquid glass (backdrop blur + lens refraction + specular rim); same library SimpMusic uses
    implementation 'io.github.kyant0:backdrop:2.0.1'
    // Pure-Java barcode/QR decoding for the FOSS Snap Photo scanner.
    implementation 'com.google.zxing:core:3.5.4'

    // FOSS camera preview and frame analysis for Petal Scanner.
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    // Google Sign-In via Credential Manager (real OAuth, consent-screen based —
    // replaces the old WebView-cookie account sync)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Legacy Google Sign-In (play-services-auth). Deprecated by Google in favor of
    // Credential Manager, but kept as the active sign-in path here as a workaround for a
    // known, still-open Credential Manager / Play Services bug ("[16] Account reauth
    // failed" - androidx.credentials.exceptions.GetCredentialCancellationException,
    // see https://github.com/android/identity-samples/issues/90) that some devices hit
    // even with fully correct OAuth configuration.

    // Google Play In-App Updates (Play flavor only: FOSS/GitHub builds have zero Play dependencies)
    playImplementation 'com.google.android.play:app-update:2.1.0'
    playImplementation 'com.google.android.play:app-update-ktx:2.1.0'

    // AndroidX Biometric for hardware biometric & device credential lock
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.autofill:autofill:1.3.0'

    // Google ML Kit On-Device Recognition APIs

    // yt-dlp (via youtubedl-android) — powers Petal Social Downloader for YouTube,
    // Instagram, TikTok, Twitter/X, Facebook, Reddit, and 1800+ more platforms.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'

    // Mozilla GeckoView & Android Components (Release channel 159.0.1)
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261102144711'
    implementation('org.mozilla.components:browser-engine-gecko:159.0.1') {
        exclude group: 'org.mozilla.geckoview', module: 'geckoview-omni'
    }
    implementation 'org.mozilla.components:concept-engine:159.0.1'
    implementation 'org.mozilla.components:browser-errorpages:159.0.1'
    implementation 'org.mozilla.components:browser-state:159.0.1'
    implementation 'org.mozilla.components:browser-session-storage:159.0.1'
    implementation 'org.mozilla.components:lib-state:159.0.1'
    implementation 'org.mozilla.components:support-base:159.0.1'
    implementation 'org.mozilla.components:support-utils:159.0.1'

    // Android Components Features (159.0.1)
    implementation 'org.mozilla.components:feature-session:159.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'org.mozilla.components:feature-prompts:159.0.1'
    implementation 'org.mozilla.components:feature-tabs:159.0.1'
    implementation 'org.mozilla.components:feature-downloads:159.0.1'
    implementation 'org.mozilla.components:feature-recentlyclosed:159.0.1'
    implementation 'org.mozilla.components:feature-webcompat:159.0.1'
    implementation 'org.mozilla.components:feature-media:159.0.1'

    // Android Components Phase 2: Web Platform Features (159.0.1)
    implementation 'org.mozilla.components:feature-addons:159.0.1'
    implementation 'org.mozilla.components:support-webextensions:159.0.1'
    implementation 'org.mozilla.components:feature-customtabs:159.0.1'
    implementation 'org.mozilla.components:feature-pwa:159.0.1'
    implementation 'org.mozilla.components:feature-contextmenu:159.0.1'
    implementation 'org.mozilla.components:feature-readerview:159.0.1'

    // Android Components Phase 3: Omnibox & Assets (159.0.1)
    implementation 'org.mozilla.components:browser-search:159.0.1'
    implementation 'org.mozilla.components:feature-search:159.0.1'
    implementation 'org.mozilla.components:feature-awesomebar:159.0.1'
    implementation 'org.mozilla.components:feature-top-sites:159.0.1'
    implementation 'org.mozilla.components:browser-icons:159.0.1'
    implementation 'org.mozilla.components:browser-thumbnails:159.0.1'
    implementation 'org.mozilla.components:lib-publicsuffixlist:159.0.1'
    implementation 'org.mozilla.components:feature-intent:159.0.1'
    implementation 'org.mozilla.components:feature-app-links:159.0.1'

    // Firefox Account + Firefox Sync (official Mozilla Android Components)
    implementation 'org.mozilla.components:service-firefox-accounts:159.0.1'
    implementation 'org.mozilla.components:concept-sync:159.0.1'
    implementation 'org.mozilla.components:concept-storage:159.0.1'
    implementation 'org.mozilla.components:concept-toolbar:159.0.1'
    implementation 'org.mozilla.components:browser-storage-sync:159.0.1'
    implementation 'org.mozilla.components:feature-syncedtabs:159.0.1'
    implementation 'org.mozilla.components:service-sync-logins:159.0.1'
    implementation 'org.mozilla.components:lib-dataprotect:159.0.1'

    // Dagger Hilt Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // Shizuku API & Provider for direct APK installation without root
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
