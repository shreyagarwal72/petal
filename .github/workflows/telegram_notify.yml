          author = html.escape(os.environ.get("ACTOR", "Unknown"))
          issue_url = os.environ.get("ISSUE_URL", "")
          raw_body = os.environ.get("ISSUE_BODY", "") or "No description provided."
          if len(raw_body) > 400:
