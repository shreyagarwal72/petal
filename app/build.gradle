apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'dagger.hilt.android.plugin'

android {

    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        applicationId "com.petal.browser"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 380
        versionName "3.8"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        resConfigs "ar", "b+hi+Latn", "b+sr+Latn", "cs", "de", "el", "es", "et", "fa", "fr", "he", "hi", "hu", "id", "it", "ja", "nl", "pl", "pt", "ro", "ru", "sr", "sv", "tr", "uk", "vi", "zh", "zh-rTW"
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            // Keep the universal APK so all supported ABIs are available in one package.
            universalApk true
        }
    }

    // Keep ABI splits available for variant generation while retaining the universal APK.
    // Google Play / bundletool will deliver only the native ABI required by the
    // target device instead of downloading GeckoView and other native libraries
    // for unrelated architectures.
    bundle {
        abi {
            enableSplit = true
        }
        language {
            enableSplit = true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : (file('release.keystore').exists() ? 'release.keystore' : 'debug.keystore'))
            storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : 'android'
            keyAlias project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : (file('release.keystore').exists() ? 'releasekey' : 'androiddebugkey')
            keyPassword project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
    namespace 'com.petal.browser'

    // youtubedl-android (Chaquopy/Python) unzips libpython.zip.so from disk at runtime via
    // ZipFile/RandomAccessFile. When AGP packages native libs compressed and uncompressed for
    // mmap loading (the default since AGP 4.2 targeting API 23+), .so files are stored
    // compressed inside the APK and never extracted to the app's native lib directory, so
    // YoutubeDL.init() throws FileNotFoundException on libpython.zip.so. Force legacy
    // (uncompressed, extracted-to-disk) packaging so youtubedl-android can open it as a file.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libxul.so', '**/libc++_shared.so', '**/libmozglue.so']
        }
        resources {
            pickFirsts += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    return void
}

// Kotlin 2.4 removed the legacy android { kotlinOptions {} } DSL (hard compile error).
// Use the compilerOptions DSL instead.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.addAll(
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3ExpressiveApi"
        )
    }
}

tasks.withType(com.android.build.gradle.internal.tasks.CheckAarMetadataTask).configureEach {
    enabled = false
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.4.0'
        force 'org.jetbrains.kotlin:kotlin-reflect:2.4.0'
        // Dagger/Hilt (>= 2.57) no longer shades kotlin-metadata-jvm. Its bundled reader tops out at
        // Kotlin metadata 2.3.0, but Mozilla Components 155 ships 2.4.0 metadata, so force a matching reader.
        force 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'com.airbnb.android:lottie-compose:6.6.2'

    // Jetpack Glance — used for the home screen widget so it can be built with real
    // Material 3 (Expressive) components/color roles instead of hand-rolled RemoteViews.
    implementation 'androidx.glance:glance:1.1.1'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'

    // AndroidX Activity, Lifecycle, and SavedState Explicit KTX Dependencies
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.savedstate:savedstate-ktx:1.2.1'

    // Compose Dependencies
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha17'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.github.tonyofrancis.Fetch:fetch2:3.4.1'
    implementation 'com.github.tonyofrancis.Fetch:fetch2okhttp:3.4.1'
    // Pure-Java barcode/QR decoding for the FOSS Snap Photo scanner.
    implementation 'com.google.zxing:core:3.5.3'
    // FOSS camera preview and frame analysis for Petal Scanner.
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    // Google Sign-In via Credential Manager (real OAuth, consent-screen based —
    // replaces the old WebView-cookie account sync)
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Legacy Google Sign-In (play-services-auth). Deprecated by Google in favor of
    // Credential Manager, but kept as the active sign-in path here as a workaround for a
    // known, still-open Credential Manager / Play Services bug ("[16] Account reauth
    // failed" - androidx.credentials.exceptions.GetCredentialCancellationException,
    // see https://github.com/android/identity-samples/issues/90) that some devices hit
    // even with fully correct OAuth configuration.

    // AndroidX Biometric for hardware biometric & device credential lock
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Google ML Kit On-Device Recognition APIs

    // Hidden API bypass for non-SDK interface access (e.g. GeckoThread on Android 15/16)
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    // yt-dlp (via youtubedl-android) — powers Petal Social Downloader for YouTube,
    // Instagram, TikTok, Twitter/X, Facebook, Reddit, and 1800+ more platforms.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:aria2c:0.18.1'

    // Mozilla GeckoView & Android Components (Release channel 155.0.1)
    implementation 'org.mozilla.geckoview:geckoview:155.0.20260903215306'
    implementation('org.mozilla.components:browser-engine-gecko:155.0.1') {
        exclude group: 'org.mozilla.geckoview', module: 'geckoview-omni'
    }
    implementation 'org.mozilla.components:concept-engine:155.0.1'
    implementation 'org.mozilla.components:browser-state:155.0.1'
    implementation 'org.mozilla.components:browser-session-storage:155.0.1'
    implementation 'org.mozilla.components:lib-state:155.0.1'
    implementation 'org.mozilla.components:support-base:155.0.1'
    implementation 'org.mozilla.components:support-utils:155.0.1'

    // Android Components Features (155.0.1)
    implementation 'org.mozilla.components:feature-readerview:155.0.1'
    implementation 'org.mozilla.components:feature-findinpage:155.0.1'
    implementation 'org.mozilla.components:feature-sitepermissions:155.0.1'
    implementation 'org.mozilla.components:feature-prompts:155.0.1'
    implementation 'org.mozilla.components:feature-pwa:155.0.1'
    implementation 'org.mozilla.components:feature-downloads:155.0.1'
    implementation 'org.mozilla.components:feature-search:155.0.1'
    implementation 'org.mozilla.components:feature-webcompat:155.0.1'
    implementation 'org.mozilla.components:feature-customtabs:155.0.1'
    implementation 'org.mozilla.components:feature-media:155.0.1'

    // Dagger Hilt Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.58'
    kapt 'com.google.dagger:hilt-compiler:2.58'
    kapt 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
}
