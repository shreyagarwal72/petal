name: Android CI/CD Build

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: petal-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign & ZipAlign Release APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Using repository SIGNING_KEY secret..."
            echo "$SIGNING_KEY" | base64 -d > app/release.keystore
            STORE_PASS="$KEY_STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            ALIAS_NAME="$ALIAS"
          else
            echo "SIGNING_KEY secret is not configured."
            if [ -f app/release.keystore ]; then
              echo "Using existing repository app/release.keystore..."
            else
              echo "Generating temporary release signing key..."
              keytool -genkey -v -keystore app/release.keystore -storepass android -alias releasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release, O=Android, C=US"
            fi
            STORE_PASS="android"
            KEY_PASS="android"
            ALIAS_NAME="releasekey"
          fi

          ANDROID_SDK_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $ANDROID_SDK_BUILD_TOOLS"

          mkdir -p signed_apks
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              aligned_apk="aligned_$filename"
              final_apk="signed_apks/$filename"

              $ANDROID_SDK_BUILD_TOOLS/zipalign -v -p 4 "$apk" "$aligned_apk"

              $ANDROID_SDK_BUILD_TOOLS/apksigner sign \
                --ks app/release.keystore \
                --ks-pass pass:"$STORE_PASS" \
                --key-pass pass:"$KEY_PASS" \
                --ks-key-alias "$ALIAS_NAME" \
                --out "$final_apk" \
                "$aligned_apk"

              $ANDROID_SDK_BUILD_TOOLS/apksigner verify --verbose "$final_apk"
              rm -f "$aligned_apk"
            fi
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: petal-browser-release
          path: signed_apks/*.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version and Changelog
        id: get_version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" app/build.gradle | head -n 1 | awk '{print $2}')
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            cat "$CHANGELOG_FILE" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG=Release v$VERSION" >> $GITHUB_ENV
          fi

      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: petal-browser-release
          path: apks/release

      - name: Prepare Release APK Files
        run: |
          mkdir -p dist
          find apks/release -type f

          for f in apks/release/*.apk; do
            if [[ "$f" == *"arm64-v8a"* ]]; then
              cp "$f" dist/petal-browser-arm64-v8a-release.apk
            elif [[ "$f" == *"armeabi-v7a"* ]]; then
              cp "$f" dist/petal-browser-armeabi-v7a-release.apk
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" dist/petal-browser-universal-release.apk
            else
              cp "$f" dist/$(basename "$f")
            fi
          done
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || env.APP_VERSION }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Petal Browser {0} Release', github.ref_name) || format('Petal Browser {0} Release', env.APP_VERSION) }}
          body: |
            ## What's Changed in ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || env.APP_VERSION }}

            ${{ env.CHANGELOG }}

            ---

            ### Direct APK Downloads:
            - **`petal-browser-arm64-v8a-release.apk`**: 64-bit ARM architecture (Recommended for modern smartphones)
            - **`petal-browser-armeabi-v7a-release.apk`**: 32-bit ARM architecture (For older devices)
            - **`petal-browser-universal-release.apk`**: Universal build containing all ABIs
          files: |
            dist/*.apk
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

