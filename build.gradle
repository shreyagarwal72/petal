// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.14'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.60.1'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.mozilla.org/maven2/' }
        // GitHub Packages (compose-miuix-ui/miuix)
        //
        // GitHub Packages does NOT support anonymous access, so credentials are required
        // even for public packages.
        //
        // Recommended: environment variables
        //   - GITHUB_ACTOR : your GitHub username
        //   - GITHUB_TOKEN : GitHub Actions token, or a classic PAT with `read:packages`
        // Alternative: define `gpr.user` and `gpr.key` in ~/.gradle/gradle.properties
        // (NOT in this repo).
        def miuixGprUser = providers.gradleProperty('gpr.user')
                .orElse(providers.environmentVariable('GITHUB_ACTOR'))
        def miuixGprKey = providers.gradleProperty('gpr.key')
                .orElse(providers.environmentVariable('GITHUB_TOKEN'))
        maven {
            name = 'GitHubPackagesMiuix'
            url = uri('https://maven.pkg.github.com/compose-miuix-ui/miuix')
            if (miuixGprUser.isPresent() && miuixGprKey.isPresent()) {
                credentials {
                    username = miuixGprUser.get()
                    password = miuixGprKey.get()
                }
            }
        }
    }
}
