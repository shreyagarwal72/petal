org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.caching.enabled=true
ksp.incremental=true
ksp.incremental.intermodule=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.useAndroidX=true
android.dependency.compileSdkCheck=warn
android.r8.max-workers=2

# Must match the org.mozilla.appservices version pulled in by org.mozilla.components:service-firefox-accounts:159.0.1.
# Find it with:  ./gradlew :app:dependencies --configuration releaseRuntimeClasspath | grep appservices
appServicesVersion=159.0.0
