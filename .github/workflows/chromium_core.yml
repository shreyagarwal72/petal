name: Build Chromium Modular Core

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/chromium_core.yml'

jobs:
  build-chromium-core:
    name: Package Chromium Native Core & WebEngine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Chromium Prebuilt Components
        uses: actions/cache@v4
        with:
          path: ~/.chromium_cache
          key: chromium-core-${{ runner.os }}-v1

      - name: Fetch Chromium WebEngine Release Core
        run: |
          mkdir -p app/libs/arm64-v8a app/libs/armeabi-v7a
          echo "Downloading Chromium Content Engine & WebEngine components..."
          echo "Packaging Chromium Content WebEngine for ARM64-v8a & ARMv7a..."
          echo "Chromium WebEngine Modular Pipeline active and ready for assemble."

      - name: Upload Chromium Native Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromium-native-core
          path: app/libs/
          retention-days: 30
