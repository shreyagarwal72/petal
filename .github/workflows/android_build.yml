name: Android CI/CD Build

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC\" -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foss-browser-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          retention-days: 30

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Using repository SIGNING_KEY secret for signing..."
            echo "$SIGNING_KEY" | base64 -d > release.keystore
            STORE_PASS="$KEY_STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            ALIAS_NAME="$ALIAS"
          else
            echo "SIGNING_KEY secret is not configured. Generating self-signed fallback keystore..."
            keytool -genkey -v -keystore release.keystore -alias fallbackkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FossBrowser, OU=Dev, O=Foss, L=City, S=State, C=US"
            STORE_PASS="android"
            KEY_PASS="android"
            ALIAS_NAME="fallbackkey"
          fi
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release.keystore \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                "$apk" "$ALIAS_NAME"
            fi
          done
          rm -f release.keystore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foss-browser-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Debug APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: foss-browser-debug
          path: apks/debug

      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: foss-browser-release
          path: apks/release

      - name: Prepare Release APK Files
        run: |
          mkdir -p dist
          cp apks/debug/*arm64-v8a*.apk dist/foss-browser-debug-arm64.apk 2>/dev/null || cp apks/debug/*.apk dist/foss-browser-debug-arm64.apk 2>/dev/null || true
          cp apks/release/*universal*.apk dist/foss-browser-release.apk 2>/dev/null || cp apks/release/*.apk dist/foss-browser-release.apk 2>/dev/null || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Petal Browser v1.0.0 Release' }}
          body: |
            ## Petal Browser Release
            Automated production and debug APK build.

            ### Included APK Downloads:
            - **`foss-browser-release.apk`**: Release APK (Signed & Installable)
            - **`foss-browser-debug-arm64.apk`**: Single ARM64 Debug APK (ARM64-v8a Architecture)
          files: |
            dist/foss-browser-release.apk
            dist/foss-browser-debug-arm64.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
