name: Android CI/CD Build

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign & ZipAlign Release APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "✅ Using SIGNING_KEY secret — decoding keystore..."
            echo "$SIGNING_KEY" | base64 -d > /tmp/signing.keystore
            STORE_PASS="$KEY_STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            ALIAS_NAME="$ALIAS"
            echo "🔑 Secret keystore alias: $ALIAS_NAME"
            keytool -list -keystore /tmp/signing.keystore -storepass "$STORE_PASS" 2>&1 | head -6
          else
            echo "⚠️  SIGNING_KEY secret not set — using app/release.keystore from repo"
            if [ ! -f app/release.keystore ]; then
              echo "❌ No release.keystore found in repo either! Generating temporary key (NOT for production)..."
              keytool -genkey -v -keystore /tmp/signing.keystore -storepass android \
                -alias releasekey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Release, O=Android, C=US"
            else
              cp app/release.keystore /tmp/signing.keystore
            fi
            STORE_PASS="android"
            KEY_PASS="android"
            ALIAS_NAME="releasekey"
            echo "🔑 Repo keystore alias: $ALIAS_NAME"
            keytool -list -keystore /tmp/signing.keystore -storepass "$STORE_PASS" 2>&1 | head -6
          fi

          # Determine alias: if ALIAS_NAME is provided and found, use it; otherwise detect alias dynamically from keystore
          DETECTED_ALIAS=$(keytool -list -keystore /tmp/signing.keystore -storepass "$STORE_PASS" 2>/dev/null | grep 'PrivateKeyEntry' | head -n 1 | awk -F ',' '{print $1}' | xargs)
          if [ -n "$ALIAS_NAME" ] && keytool -list -keystore /tmp/signing.keystore -storepass "$STORE_PASS" 2>&1 | grep -q "$ALIAS_NAME"; then
            echo "✅ Specified alias '$ALIAS_NAME' verified in keystore."
          elif [ -n "$DETECTED_ALIAS" ]; then
            echo "⚠️ Specified alias '$ALIAS_NAME' not matched, but detected PrivateKeyEntry alias '$DETECTED_ALIAS' in keystore. Using '$DETECTED_ALIAS'."
            ALIAS_NAME="$DETECTED_ALIAS"
          else
            echo "❌ ERROR: No valid signing alias found in keystore! Aborting."
            keytool -list -keystore /tmp/signing.keystore -storepass "$STORE_PASS" 2>&1
            exit 1
          fi
          echo "🔑 Final signing alias: $ALIAS_NAME"

          ANDROID_SDK_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $ANDROID_SDK_BUILD_TOOLS"

          mkdir -p signed_apks
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              aligned_apk="/tmp/aligned_$filename"
              final_apk="signed_apks/$filename"

              $ANDROID_SDK_BUILD_TOOLS/zipalign -v -p 4 "$apk" "$aligned_apk"

              $ANDROID_SDK_BUILD_TOOLS/apksigner sign \
                --ks /tmp/signing.keystore \
                --ks-pass pass:"$STORE_PASS" \
                --key-pass pass:"$KEY_PASS" \
                --ks-key-alias "$ALIAS_NAME" \
                --out "$final_apk" \
                "$aligned_apk"

              $ANDROID_SDK_BUILD_TOOLS/apksigner verify --verbose "$final_apk"
              rm -f "$aligned_apk"
            fi
          done


      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: petal-browser-release
          path: signed_apks/*.apk
          retention-days: 1

      - name: Prepare Release APK Files
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          find signed_apks -type f

          for f in signed_apks/*.apk; do
            if [ -f "$f" ]; then
              if [[ "$f" == *"arm64-v8a"* ]]; then
                cp "$f" dist/petal-browser-arm64-v8a-release.apk
              elif [[ "$f" == *"armeabi-v7a"* ]]; then
                cp "$f" dist/petal-browser-armeabi-v7a-release.apk
              elif [[ "$f" == *"x86_64"* ]]; then
                cp "$f" dist/petal-browser-x86_64-release.apk
              elif [[ "$f" == *"x86"* ]]; then
                cp "$f" dist/petal-browser-x86-release.apk
              elif [[ "$f" == *"universal"* ]]; then
                cp "$f" dist/petal-browser-universal-release.apk
              else
                cp "$f" dist/$(basename "$f")
              fi
            fi
          done
          ls -la dist/

      - name: Extract App Version and Changelog
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        id: get_version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" app/build.gradle | head -n 1 | awk '{print $2}')
          echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -f "$CHANGELOG_FILE" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_ENV
            cat "$CHANGELOG_FILE" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG=Release v$VERSION" >> $GITHUB_ENV
          fi

      - name: Create or Update GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || env.APP_VERSION }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Petal Browser {0} Release', github.ref_name) || format('Petal Browser {0} Release', env.APP_VERSION) }}
          body: |
            ## What's Changed in ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || env.APP_VERSION }}

            ${{ env.CHANGELOG }}
          files: |
            dist/*.apk
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

