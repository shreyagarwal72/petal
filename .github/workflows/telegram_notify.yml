  notify-build:
    name: Notify Workflow Build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
      WORKFLOW_NAME: ${{ github.event.workflow.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Send Workflow Build Notification to Telegram Topic
        run: |
          python3 - << 'EOF'
          import os, json, html, urllib.request

          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          topic_id = os.environ.get("TELEGRAM_TOPIC_ID", "").strip()

          if not bot_token or not chat_id:
              print("⚠️ Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret in repository.")
              exit(0)

          workflow_name = html.escape(os.environ.get("WORKFLOW_NAME", "Workflow"))
          conclusion = os.environ.get("CONCLUSION", "unknown")
          branch = html.escape(os.environ.get("BRANCH", "main"))
          run_url = os.environ.get("RUN_URL", "")

          status_emoji = "✅" if conclusion == "success" else "❌"
          status_text = "BUILD SUCCESSFUL" if conclusion == "success" else "BUILD FAILED"

          message = (
              f"🌸 <b>Petal Browser CI/CD</b>\n"
              f"{status_emoji} <b>{workflow_name} - {status_text}</b>\n\n"
              f"🌿 <b>Branch:</b> <code>{branch}</code>\n"
              f"📊 <b>Status:</b> <b>{conclusion}</b>\n\n"
              f"🔗 <a href=\"{run_url}\">View Action Workflow Run</a>"
          )

          payload = {
              "chat_id": chat_id,
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          if topic_id:
              try:
                  tid = int(topic_id)
                  payload["message_thread_id"] = tid
                  print(f"🎯 Target Telegram Chat: {chat_id} | Topic ID: {tid}")
              except ValueError:
                  print(f"⚠️ Warning: TELEGRAM_TOPIC_ID '{topic_id}' is not a valid integer.")

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
                  print("✅ Telegram build notification sent successfully:", result)
          except Exception as e:
              print("❌ Telegram API Error with HTML:", e)
              try:
                  payload["parse_mode"] = None
                  req_plain = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"}
                  )
                  with urllib.request.urlopen(req_plain) as resp:
                      print("✅ Fallback plain build notification sent.")
              except Exception as e2:
                  print("❌ Fallback also failed:", e2)
          EOF
